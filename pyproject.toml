[project]
name = "pch-workspace"
version = "0.2.0"
description = "Personal Context Hub — local-first personal context for any agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "trust-kernel",
    "loopback-service",
    "portable-state",
    "agent-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "schemathesis>=3.39",
    "playwright>=1.49",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/trust-kernel",
    "packages/loopback-service",
    "packages/portable-state",
    "packages/agent-client",
    "packages/eval-harness",
]

[tool.uv.sources]
trust-kernel = { workspace = true }
loopback-service = { workspace = true }
portable-state = { workspace = true }
agent-client = { workspace = true }
eval-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "packages/trust-kernel/src",
    "packages/loopback-service/src",
    "packages/portable-state/src",
    "packages/agent-client/src",
    "packages/eval-harness/src",
]
markers = [
    "forbidden_context: seeded policy isolation tests (SC-003)",
    "perf: scale/performance checks (SC-009)",
    "release: packaged wheel install (slow; needs network)",
]
testpaths = [
    "packages/trust-kernel/tests",
    "packages/loopback-service/tests",
    "packages/portable-state/tests",
    "packages/agent-client/tests",
    "packages/eval-harness/tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trust_kernel", "loopback_service", "portable_state", "agent_client", "eval_harness"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "schemathesis>=3.39",
    "playwright>=1.49",
    "ruff>=0.9",
    "mypy>=1.14",
]
