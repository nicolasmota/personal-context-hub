name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install Python workspace
        env:
          UV_PYTHON: "3.12"
        run: uv sync --all-packages
      - name: Secrets hygiene
        run: make check-secrets
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Dist gate
        run: uv run python scripts/build_release.py && uv run python scripts/check_release.py
