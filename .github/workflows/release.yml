name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Build wheels
        run: uv run python scripts/build_release.py
      - name: Release gate
        run: uv run python scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  matrix:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v4
      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install from dist
        shell: bash
        run: uv tool install --find-links dist "pch-server==${{ steps.ver.outputs.version }}"
      - name: Server help
        shell: bash
        run: pch-server --help

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v4
      - name: Publish
        run: uv publish
