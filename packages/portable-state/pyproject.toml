[project]
name = "pch-archive"
version = "0.2.0"
description = "Portable personal state export/import"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pch-core==0.2.0",
    "pyrage>=1.2",
    "pydantic>=2.10",
]

[project.scripts]
pch-archive = "pch_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pch_archive"]

[tool.uv.sources]
pch-core = { workspace = true }
