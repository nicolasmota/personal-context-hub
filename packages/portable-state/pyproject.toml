[project]
name = "portable-state"
version = "0.2.0"
description = "Portable personal state export/import"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "trust-kernel==0.2.0",
    "pyrage>=1.2",
    "pydantic>=2.10",
]

[project.scripts]
pch-archive = "portable_state.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portable_state"]

[tool.uv.sources]
trust-kernel = { workspace = true }
