[project]
name = "agent-client"
version = "0.2.0"
description = "Python SDK and demo agent for Personal Context"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "trust-kernel==0.2.0",
    "portable-state==0.2.0",
    "httpx>=0.28",
    "mcp>=1.9",
    "pydantic>=2.10",
]

[project.scripts]
personal-context = "agent_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_client"]

[tool.uv.sources]
trust-kernel = { workspace = true }
portable-state = { workspace = true }
