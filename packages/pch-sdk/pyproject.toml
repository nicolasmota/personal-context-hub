[project]
name = "pch-sdk"
version = "0.2.0"
description = "Python SDK and demo agent for Personal Context Hub"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pch-core==0.2.0",
    "pch-archive==0.2.0",
    "httpx>=0.28",
    "mcp>=1.9",
    "pydantic>=2.10",
]

[project.scripts]
pch = "pch_sdk.__main__:main"
pch-sdk = "pch_sdk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pch_sdk"]

[tool.uv.sources]
pch-core = { workspace = true }
pch-archive = { workspace = true }
