[project]
name = "eval-harness"
version = "0.2.0"
description = "Development loop, simulation, and eval harnesses for Personal Context Hub"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "trust-kernel==0.2.0",
]

[project.scripts]
pch-lab = "eval_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.uv.sources]
trust-kernel = { workspace = true }
