[project]
name = "pch-lab"
version = "0.2.0"
description = "Development loop, simulation, and eval harnesses for Personal Context Hub"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pch-core==0.2.0",
]

[project.scripts]
pch-lab = "pch_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pch_lab"]

[tool.uv.sources]
pch-core = { workspace = true }
