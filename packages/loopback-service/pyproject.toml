[project]
name = "loopback-service"
version = "0.2.0"
description = "Local Personal Context Hub service: FastAPI control plane and MCP server"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "trust-kernel==0.2.0",
    "portable-state==0.2.0",
    "agent-client==0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "watchfiles>=1.0",
    "mcp>=1.9",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
]

[project.scripts]
pch-server = "loopback_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/loopback_service"]

[tool.uv.sources]
trust-kernel = { workspace = true }
portable-state = { workspace = true }
agent-client = { workspace = true }
