<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Personal Context</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #121110;
      }
      .card {
        width: 1280px;
        height: 640px;
        box-sizing: border-box;
        padding: 88px 96px;
        background: radial-gradient(1200px 500px at 80% 120%, #2a2418 0%, #121110 55%);
        color: #f4f1ea;
        font-family: ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .kicker {
        color: #e6b422;
        letter-spacing: 0.16em;
        font-size: 18px;
        text-transform: uppercase;
        font-weight: 600;
      }
      h1 {
        font-size: 72px;
        line-height: 1.05;
        margin: 18px 0 28px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      p {
        font-size: 30px;
        color: #c6c0b4;
        max-width: 980px;
        line-height: 1.3;
        margin: 0;
      }
      .tags {
        margin-top: 48px;
        color: #9a9488;
        font-size: 20px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">MCP · local-first · encrypted vault</div>
      <h1>Personal Context</h1>
      <p>Encrypted vault on this device. Agents get a granted slice.</p>
      <div class="tags">On-device · loopback only · any agent</div>
    </div>
  </body>
</html>
